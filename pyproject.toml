[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datatown"
version = "0.1.0"
description = "Archive, inspect, and query third-party datasets used by Peoplebot."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35,<2",
    "psycopg[binary]>=3.2,<4",
    "typer>=0.12,<1",
]

[project.scripts]
datatown = "datatown.cli:app"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.35,<2",
    "mypy>=1.11,<2",
    "pytest>=8.3,<10",
    "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/datatown"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: read-only checks against configured external services",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

